<main class="overflow-hidden h-full w-full flex">
  @if (!isMobile()) {
    <section class="sm:w-1/2 md:w-1/3 h-dvh overflow-hidden">
      <app-conversation-list></app-conversation-list>
    </section>
    <hlm-separator decorative orientation="vertical" />
    <section class="h-dvh overflow-hidden sm:w-1/2 md:w-2/3">
      @if (activeView() !== "chatbox") {
        <app-messages-start />
      } @else {
        <ng-container *ngTemplateOutlet="routerOutlet"></ng-container>
      }
    </section>
  } @else {
    <section class="h-dvh w-full">
      <ng-container *ngTemplateOutlet="routerOutlet"></ng-container>
    </section>
  }
</main>

<ng-template #routerOutlet>
  <router-outlet />
</ng-template>
