#
# Headers applied to every response.
#
# The API sets a CSP via helmet, but that header only ever travelled with API
# responses — never with the document that actually executes scripts. The app
# was therefore served with no CSP at all, which is the one place it matters.
#
# connect-src has to name the API and storage origins explicitly: the app talks
# to an absolute cross-origin host, and 'self' does not cover it. wss: is the
# websocket. Adjust these to match the deployment.
#
# Cloudflare Web Analytics (automatic setup) injects its beacon into the HTML at
# the edge, after nginx has already set this header, so the app's own CSP was
# blocking a script the app never asked for. Both hosts are needed: the script
# is served from static.cloudflareinsights.com, and it reports to
# cloudflareinsights.com/cdn-cgi/rum. Drop both if automatic setup is turned off.
#
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://api-chat-app.zura156.xyz wss://api-chat-app.zura156.xyz https://s3.zura156.xyz https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
# frame-ancestors above supersedes this for modern browsers; kept for old ones.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
