<main class="max-w-2xl mx-auto px-4 py-8 space-y-8">
  <div>
    <h1 class="text-lg font-semibold tracking-tight">Appearance</h1>
    <p class="text-sm text-muted-foreground">
      Customize how the app looks and feels.
    </p>
  </div>

  <hlm-separator decorative />

  <!-- Light / Dark / System -->
  <section class="space-y-4">
    <div>
      <h3 class="text-sm font-medium">Mode</h3>
      <p class="text-xs text-muted-foreground">
        Choose your preferred color scheme
      </p>
    </div>
    <div class="grid grid-cols-3 gap-3">
      @for (mode of modes; track mode.value) {
      <button
        [disabled]="isDarkOnlyTheme() && mode.value !== 'dark'"
        class="flex flex-col items-center gap-y-2.5 p-4 rounded-xl border hover:bg-muted/40 transition-colors cursor-pointer disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed"
        [class.border-primary]="selectedTheme() === mode.value"
        [class.bg-muted/40]="selectedTheme() === mode.value"
        [class.border-border]="selectedTheme() !== mode.value"
        (click)="setTheme(mode.value)"
      >
        <!-- mini preview -->
        <div
          class="w-full h-10 rounded-lg overflow-hidden border border-border"
        >
          @if (mode.value === 'light') {
          <div class="w-full h-full bg-white"></div>
          } @else if (mode.value === 'dark') {
          <div class="w-full h-full bg-zinc-900"></div>
          } @else {
          <div class="w-full h-full grid grid-cols-2">
            <div class="bg-white"></div>
            <div class="bg-zinc-900"></div>
          </div>
          }
        </div>
        <span class="text-xs font-medium">{{ mode.label }}</span>
        @if (selectedTheme() === mode.value) {
        <ng-icon hlm name="lucideCheck" size="xs" class="text-primary" />
        }
      </button>
      }
    </div>
  </section>

  <hlm-separator decorative />

  <!-- Color themes -->
  <section class="space-y-4">
    <div>
      <h3 class="text-sm font-medium">Theme</h3>
      <p class="text-xs text-muted-foreground">Pick a color palette</p>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
      @for (theme of colorThemes; track theme.value) {
      <button
        class="flex flex-col items-center gap-y-2.5 p-3 rounded-xl border hover:bg-muted/40 transition-colors cursor-pointer"
        [class.border-primary]="selectedColorTheme() === theme.value"
        [class.bg-muted/40]="selectedColorTheme() === theme.value"
        [class.border-border]="selectedColorTheme() !== theme.value"
        (click)="setColorTheme(theme.value)"
      >
        <!-- swatch strip -->
        <div class="w-full h-8 rounded-lg overflow-hidden flex">
          <div class="flex-1 h-full" [style.background]="theme.bg"></div>
          <div class="w-1/3 h-full" [style.background]="theme.primary"></div>
        </div>
        <span class="text-xs font-medium">{{ theme.label }}</span>
        @if (selectedColorTheme() === theme.value) {
        <ng-icon hlm name="lucideCheck" size="xs" class="text-primary" />
        }
      </button>
      }
    </div>
  </section>

  <hlm-separator decorative />
</main>
