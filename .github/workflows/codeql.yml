name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 9 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none
          node-version: '20'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Essential for Angular v20+ and Express TypeScript projects
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    # Install dependencies (crucial for proper TypeScript analysis)
    - name: Install dependencies
      run: |
        npm ci

    # Initialize CodeQL with unique configuration
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality
        # Use a completely unique source root to avoid conflicts
        source-root: ${{ github.workspace }}

    # Build step for Angular (if needed for better analysis)
    - name: Build Angular application
      if: matrix.language == 'javascript-typescript'
      run: |
        # Build Angular app for better code analysis
        npm run build --if-present

    # Use a completely different approach for analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "advanced-security-scan"
        output: sarif-results
        upload: false

    # Manual upload with different approach
    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: sarif-results/javascript.sarif
        category: "advanced-security-scan"
