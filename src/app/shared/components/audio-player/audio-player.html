@let file = audio();

<div class="relative w-full flex items-center">
  <audio
    #audioPlayer
    [src]="file.variants?.original"
    (timeupdate)="onTimeUpdate(audioPlayer)"
  ></audio>

  <hlm-progress
    aria-labelledby="loading"
    class="w-full h-9 bg-muted inline-flex overflow-hidden relative rounded-full"
    [value]="progressPercentage()"
  >
    <hlm-progress-indicator
      class="bg-primary/20 flex-1 h-full inline-flex transform-gpu transition-all w-full ease-linear duration-300"
    />

    <!-- Play/pause -->
    <button
      hlmBtn
      variant="ghost"
      (click)="audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause()"
      class="cursor-pointer absolute top-1/2 -translate-y-1/2 left-1 size-7 p-0 flex items-center justify-center rounded-full text-muted-foreground hover:text-foreground hover:bg-transparent transition-colors"
    >
      <ng-icon
        hlm
        size="sm"
        [name]="audioPlayer.paused ? 'lucidePlay' : 'lucidePause'"
      />
    </button>

    <!-- Time -->
    <span
      class="absolute top-1/2 -translate-y-1/2 right-3 text-xs text-muted-foreground tabular-nums select-none"
    >
      {{ currentTime() | formatTime }} / {{ duration() | formatTime }}
    </span>
  </hlm-progress>
</div>
