@let file = this.file();
<div
  class="bg-accent/80 hover:bg-accent border border-border transition-colors rounded-xl p-3 w-full sm:w-64 max-w-70"
>
  <a
    [href]="file?.variants?.original"
    target="_blank"
    [download]="file?.originalName"
    class="flex items-center gap-3 w-full outline-none"
  >
    <div
      class="shrink-0 flex items-center justify-center size-10 rounded-lg bg-blue-500/10 text-blue-500"
    >
      <ng-icon hlm name="lucideDownload" size="sm" />
    </div>

    <div class="flex flex-col flex-1 min-w-0 justify-center">
      <h1
        class="text-sm font-medium text-foreground truncate"
        [title]="file?.originalName"
      >
        {{ file?.originalName }}
      </h1>
      <span class="text-xs text-muted-foreground mt-0.5">
        {{ (file?.fileSize || 0) | fileSize }}
      </span>
    </div>
  </a>
</div>
