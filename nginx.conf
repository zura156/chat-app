server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # don't advertise the exact nginx version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    #
    # Security headers.
    #
    # Defined once at server level rather than repeated per location. nginx's
    # add_header does not inherit into a block that declares its own, so the
    # static-asset block below silently dropped every header except nosniff —
    # and a map/include is the only way to keep the two in step.
    #
    # $api_origin and $s3_origin come from the build; they are the only remote
    # hosts the app is allowed to reach.
    #
    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;

        # the shell must never be cached, or clients keep booting an old
        # index.html that points at hashed chunks which no longer exist
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location ~* \.(?:css|js|json|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
    }
}
