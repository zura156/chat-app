<div class="overflow-hidden h-full">
  @if (isMobile()) {
    <main 
      appSwipe
      (swipeLeft)="onSwipeLeft()"
      (swipeRight)="onSwipeRight()"
      class="relative w-full h-screen overflow-hidden md:flex"
    >
      @if(activeView() === 'conversations' || activeView() === 'users'){
        <div 
          [@slideAnimation]="activeView()" 
        >
        {{activeView()}}
          <ng-container *ngTemplateOutlet="leftSide" ></ng-container>
        </div>
      } @else {
        @if(activeView() === 'chatbox'){
        
        {{activeView()}}
          <div 
            [@slideAnimation]="activeView()" 
            class="h-screen"
          >
            <ng-container *ngTemplateOutlet="rightSide"></ng-container>
          </div>
        } @else if(activeView() === 'chatbox-settings') {
        {{activeView()}}
          <div 
            [@slideAnimation]="activeView()" 
            class="w-full md:w-1/2" 
          >
            <app-chatbox-settings></app-chatbox-settings>
          </div>
        } 
      }
    </main>
  } @else {
    <main class="flex space-x-4 h-screen w-full">
      <section class="w-1/3 mx-0">
        <ng-container *ngTemplateOutlet="leftSide"></ng-container>
      </section>
      <brn-separator decorative hlmSeparator orientation="vertical" />
      <section class="w-2/3">
        <ng-container *ngTemplateOutlet="rightSide"></ng-container>
      </section>
    </main>
  }

  <ng-template #leftSide>
    <div [@slideAnimation]="'left'" class="h-full">
      <app-messages-list></app-messages-list>
    </div>
  </ng-template>

  <ng-template #rightSide>
    <div [@slideAnimation]="'right'" class="h-full">

      <!-- ? intstead adding swipe support -->
      <!-- @if(isMobile()){
      <div class="p-2">
        <button
          type="button"
          (click)="goBack()"
          hlmBtn
          variant="secondary"
          class="cursor-pointer rounded-full"
        >
          <ng-icon hlm size="sm" name="lucideChevronLeft" />
        </button>
      </div>
      } -->
      <router-outlet></router-outlet>
    </div>
  </ng-template>
</div>
