@let user = this.user();
@if (user) {
  <div class="min-h-screen bg-background text-foreground">
    <!-- Cover / Banner -->
    <div
      class="relative h-48 bg-linear-to-br from-primary/20 via-primary/10 to-muted overflow-hidden"
    >
      <div
        class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,var(--tw-gradient-stops))] from-primary/30 via-transparent to-transparent"
      ></div>
      <!--
        An "Edit Cover" button sat here with no handler, on every profile
        including other people's. There is no cover upload flow.
      -->
    </div>

    <!-- Profile Header -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <div
        class="relative -mt-16 pb-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4"
      >
        <!-- Avatar -->
        <div class="flex items-end gap-5">
          <div class="relative shrink-0">
            <div
              class="w-28 h-28 rounded-full border-4 border-background bg-muted overflow-hidden shadow-lg"
            >
              <img
                [src]="user.pfp_url || '/icons/avatar.svg'"
                [alt]="user.first_name + ' ' + user.last_name"
                class="w-full h-full object-cover"
                onerror="this.src = '/icons/avatar.svg'"
              />
            </div>
            <!-- Online indicator -->
            @if (user.status === "online") {
              <span
                class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-green-500 border-2 border-background"
              ></span>
            }
          </div>

          <div class="pb-1">
            <!-- Was `first_name + last_name`, which rendered "JaneDoe". -->
            <h1 class="text-2xl font-bold tracking-tight">
              {{ user.first_name + " " + user.last_name }}
            </h1>
            <p class="text-sm text-muted-foreground">
              &#64;{{ user.username }}
            </p>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2 sm:pb-1">
          <button
            (click)="goToChat(user)"
            hlmBtn
            variant="outline"
            size="sm"
            class="cursor-pointer"
          >
            <svg
              class="w-4 h-4 mr-1.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
              />
            </svg>
            Message
          </button>

          <!-- Blocking was a schema field with no way to set it; this is it. -->
          @if (!isSelf(user)) {
            <button
              hlmBtn
              size="sm"
              [variant]="isBlocked(user) ? 'outline' : 'destructive'"
              class="cursor-pointer"
              [disabled]="blocking()"
              [attr.aria-label]="
                (isBlocked(user) ? 'Unblock ' : 'Block ') + user.username
              "
              (click)="toggleBlock(user)"
            >
              {{ isBlocked(user) ? "Unblock" : "Block" }}
            </button>
          }

          <!--
            A "Follow" button and a kebab menu, neither with a click handler and
            neither backed by a feature — there is no follow relationship and no
            overflow menu anywhere in this app. Removed; Message and Block are
            the two things you can actually do to a profile.
          -->
        </div>
      </div>

      <!-- Bio & Meta -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 pb-8">
        <!-- Left: Info Card -->
        <div class="lg:col-span-1 space-y-4">
          <div hlmCard class="p-5 space-y-4 gap-0">
            <!-- Bio -->
            <div>
              <p class="text-sm leading-relaxed text-foreground/80">
                {{ user.bio || "User has no bio yet." }}
              </p>
            </div>

            <hr class="border-border" />

            <!-- Meta info -->
            <ul class="space-y-2.5 text-sm text-muted-foreground">
              <!--
                A location row reading "Moon" and a website row linking to a
                hardcoded personal domain, both shown for every user and neither
                backed by a field on the model. Removed; only the join date
                below comes from real data.
              -->
              <li class="flex items-center gap-2.5">
                <svg
                  class="w-4 h-4 shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                  />
                </svg>
                <!--
                  Was the literal string "Joined 01/01/00" for every user. The
                  API does send `createdAt` on its public projection; nothing
                  read it.
                -->
                <span>Joined {{ user.createdAt | date: "MMMM yyyy" }}</span>
              </li>
            </ul>
            <!--
              A Posts / Followers / Following counter trio, all three hardcoded
              to 0, and a "Roles" card containing the single invented badge
              "Breather". None of the three counts and neither of the two
              concepts exists anywhere in this app. Removed rather than left
              reading zero, which still claims the feature is there.
            -->
          </div>
        </div>

        <!-- Right column -->
        <div class="lg:col-span-2 space-y-4">
          <!--
            This held a Posts / Media / Likes tab set backed by three hardcoded
            posts and six picsum.photos URLs, rendered under whichever user was
            on screen. The app has no posts feature, so it was inventing content
            and attributing it to a real person. Removed rather than wired up:
            there is nothing behind it to wire to.
          -->
          <div
            hlmCard
            class="flex flex-col items-center justify-center gap-y-2 py-16 text-muted-foreground"
          >
            <p class="text-sm">Nothing to show here yet</p>
          </div>
        </div>
      </div>
    </div>
  </div>
}
