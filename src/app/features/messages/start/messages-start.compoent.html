<main class="flex justify-center items-center h-full w-full">
  <section class="text-center">
    <img
      [src]="isDarkMode() ? '/chat-favicon-light.png' : '/chat-favicon.png'"
      alt="chat-favicon"
      class="size-16 mx-auto mb-4 rounded-xl p-1"
    />
    <h1 class="text-2xl font-bold mb-4">Welcome to the Chat App</h1>
    <p class="text-gray-600">Select a conversation to get started.</p>
    <p class="text-gray-600 mb-1">Or</p>
    <button
      hlmBtn
      variant="outline"
      class="cursor-pointer"
      [routerLink]="'/messages/new'"
    >
      Start a New Conversation
    </button>
  </section>
</main>
