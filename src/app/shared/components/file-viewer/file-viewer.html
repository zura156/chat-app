@let file = this.file();
<div hlmAttachment [class]="maxWidth() ? 'w-full' : 'max-w-52'">
  <a
    [href]="file?.variants?.original"
    target="_blank"
    [download]="file?.originalName"
    class="flex items-center gap-3 w-full outline-none"
  >
    <div hlmAttachmentMedia class="relative">
      <ng-icon name="lucideFileText" />
    </div>

    <div hlmAttachmentContent>
      <span hlmAttachmentTitle [title]="file?.originalName">
        {{ file?.originalName }}
      </span>
      <span hlmAttachmentDescription>
        {{ (file?.fileSize || 0) | fileSize }}
      </span>
    </div>

    <ng-icon
      hlm
      name="lucideDownload"
      size="sm"
      class="shrink-0 text-muted-foreground opacity-0 group-hover:opacity-100 transition-opacity"
    />
  </a>
</div>
