<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat App</title>
    <base href="/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="chat-favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="chat-favicon-light.png"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Fonts are self-hosted in fonts.css (Inter) and icons come from
         @ng-icons/lucide, so the Google Fonts stylesheets that used to be here
         (duplicated, twice each) were four unused render-blocking requests. -->
    <link rel="manifest" href="manifest.webmanifest" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-background text-foreground">
    <div
      class="pointer-events-none fixed top-0 left-0 z-40 h-345 w-140 -translate-y-87.5 -rotate-45 bg-radial-(--spotlight-gradient)"
    ></div>
    <app-root></app-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
