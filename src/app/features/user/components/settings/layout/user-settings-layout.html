<div hlmSidebarWrapper>
  <hlm-sidebar>
    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Settings</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of items; track item.title) {
              <li hlmSidebarMenuItem>
                <a hlmSidebarMenuButton
                  [routerLink]="item.url"
                  routerLinkActive="active"
                  [routerLinkActiveOptions]="{ exact: true }">
                  <ng-icon hlm [name]="item.icon" />
                  <span>{{ item.title }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </hlm-sidebar>

  <div class="flex flex-col w-full h-full min-h-dvh">
    <header class="flex items-center gap-x-2 px-4 py-3 border-b border-border shrink-0">
      <button hlmSidebarTrigger>
        <span class="sr-only">Toggle sidebar</span>
      </button>
      <span class="text-sm font-medium text-muted-foreground">Settings</span>
    </header>
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
