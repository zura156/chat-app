@let video = this.video(); @let size = this.size();

<div
  #playerContainer
  class="relative w-full flex items-center justify-center py-0 sm:py-3 outline-none"
  tabindex="0"
  (focus)="isFocused.set(true)"
  (blur)="isFocused.set(false)"
  (click)="videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause()"
>
  <video
    class="rounded-xl h-full"
    #videoPlayer
    [src]="`${apiUrl}${video.url}`"
    [volume]="volume()"
    (timeupdate)="onTimeUpdate(videoPlayer)"
    (loadeddata)="duration.set(videoPlayer.duration)"
  >
    <source [src]="`${apiUrl}${video.url}`" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div
    [ngClass]="{
      'h-full w-full absolute top-0 left-0 flex duration-150 items-end':
        size === 'sm'
    }"
  >
    <!-- opacity-0 pointer-events-none hover:pointer-events-auto hover:opacity-100  -->
    <div
      (click)="$event.stopPropagation()"
      class="z-10 flex flex-col w-full justify-end px-2 fullscreen:py-2 py-3"
    >
      <section class="w-full h-2">
        <div class="flex gap-x-2 items-center h-full w-full relative">
          <div
            #timeline
            class="w-full h-full bg-primary rounded-full relative overflow-hidden cursor-pointer"
            (mousedown)="onTimelineMousedown($event)"
          >
            <div
              class="bg-secondary h-full rounded-full w-full"
              [style.width.%]="progressPercentage()"
            ></div>
          </div>
        </div>
      </section>
      <section class="flex w-full h-full items-center justify-between pt-1">
        <div class="flex items-center">
          <button
            hlmBtn
            [size]="isFullscreen() ? 'lg' : 'sm'"
            variant="ghost"
            class="flex items-center rounded-full px-1.5 cursor-pointer"
            (click)="
              videoPlayer.paused ? videoPlayer.play() : videoPlayer.pause()
            "
          >
            <ng-icon
              hlm
              [name]="
                videoPlayer.paused ? 'lucideCirclePlay' : 'lucideCirclePause'
              "
            ></ng-icon>
          </button>
          <button
            #button
            hlmBtn
            [size]="isFullscreen() ? 'lg' : 'sm'"
            variant="ghost"
            class="flex items-center justify-start rounded-full px-1.5 fullscreen:h-11 fullscreen:px-8"
            (mouseover)="audioControl.classList.remove('hidden')"
            (mouseout)="audioControl.classList.add('hidden')"
          >
            <button
              (click)="videoPlayer.muted = !videoPlayer.muted"
              class="flex items-center rounded-full cursor-pointer"
            >
              @if(volume() === 0 || videoPlayer.muted) {
              <ng-icon hlm name="lucideVolumeX"></ng-icon>
              } @else if(volume() < 0.33) {
              <ng-icon hlm name="lucideVolume"></ng-icon>
              } @else if(volume() < 0.66) {
              <ng-icon hlm name="lucideVolume1"></ng-icon>
              } @else {
              <ng-icon hlm name="lucideVolume2"></ng-icon>
              }
            </button>

            <div #audioControl class="hidden px-2">
              <input
                type="range"
                min="0"
                max="1"
                step="0.01"
                [value]="volume()"
                (change)="setVolume($event)"
                (wheel)="onVolumeScroll($event)"
                class="w-16 h-2 bg-primary rounded-lg appearance-none cursor-ns-resize"
              />
            </div>
          </button>

          <span class="ml-3 text-sm select-none">
            {{ `${(currentTime() | formatTime)} / ${(duration() | formatTime)}` }}
          </span>
        </div>

        <div>
          <button
            hlmBtn
            size="sm"
            variant="ghost"
            class="flex items-center rounded-full px-1.5 fullscreen:h-11 fullscreen:px-8 cursor-pointer"
            (click)="toggleFullscreen()"
          >
            <ng-icon
              hlm
              [name]="isFullscreen() ? 'lucideMinimize' : 'lucideFullscreen'"
            ></ng-icon>
          </button>
        </div>
      </section>
    </div>
  </div>
</div>
