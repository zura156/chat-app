@let file = audio();

<div class="w-full flex items-center gap-2">
  <audio
    #audioPlayer
    [src]="file.variants?.original"
    (timeupdate)="onTimeUpdate(audioPlayer)"
  ></audio>

  <button
    hlmBtn
    variant="ghost"
    (click)="audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause()"
    class="cursor-pointer shrink-0 size-8 p-0 flex items-center justify-center rounded-full bg-primary text-primary-foreground hover:opacity-90 transition-opacity"
  >
    <ng-icon
      hlm
      size="sm"
      [name]="audioPlayer.paused ? 'lucidePlay' : 'lucidePause'"
    />
  </button>

  <div
    class="flex-1 h-8 flex items-center gap-px cursor-pointer"
    (click)="seek($event, audioPlayer)"
  >
    @for (bar of bars(); track $index) {
      <span
        class="flex-1 rounded-full min-w-px transition-colors"
        [class]="$index < playedBars() ? 'bg-primary' : 'bg-muted-foreground/30'"
        [style.height.%]="bar * 100"
      ></span>
    }
  </div>

  <span
    class="text-xs text-muted-foreground tabular-nums select-none shrink-0"
  >
    {{
      (audioPlayer.paused && currentTime() === 0 ? duration() : currentTime())
        | formatTime
    }}
  </span>
</div>
