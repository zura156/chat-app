<!-- Compact Recording Interface -->
<div
  class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg border"
  *ngIf="!isRecording && !audioBlob"
>
  <button
    (click)="startRecording()"
    [disabled]="!hasPermission"
    class="flex items-center justify-center w-10 h-10 bg-blue-500 text-white rounded-full hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
    [title]="hasPermission ? 'Hold to record' : 'Microphone access needed'"
  >
    <span class="text-lg">🎤</span>
  </button>
  <span class="text-sm text-gray-600">
    {{
      hasPermission ? "Tap to record audio message" : "Microphone access needed"
    }}
  </span>
</div>

<!-- Recording Interface -->
<div
  class="flex items-center gap-3 p-3 bg-red-50 border border-red-200 rounded-lg"
  *ngIf="isRecording"
>
  <div class="flex items-center gap-2">
    <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
    <span class="text-red-600 font-medium">{{
      formatTime(recordingTime)
    }}</span>
  </div>

  <!-- Waveform Animation -->
  <div class="flex items-center gap-1 flex-1 max-w-32">
    <div
      *ngFor="let level of audioLevels; let i = index"
      class="bg-red-400 rounded-sm"
      [style.height.px]="level"
      [style.width.px]="2"
      [style.animation]="'pulse 0.5s ease-in-out infinite'"
    ></div>
  </div>

  <div class="flex gap-2">
    <button
      (click)="stopRecording()"
      class="flex items-center justify-center w-8 h-8 bg-red-500 text-white rounded-full hover:bg-red-600 transition-all duration-200"
      title="Stop recording"
    >
      <span class="text-sm">⏹️</span>
    </button>
    <button
      (click)="cancelRecording()"
      class="flex items-center justify-center w-8 h-8 bg-gray-500 text-white rounded-full hover:bg-gray-600 transition-all duration-200"
      title="Cancel"
    >
      <span class="text-sm">❌</span>
    </button>
  </div>
</div>

<!-- Preview Interface -->
<div
  class="flex items-center gap-3 p-3 bg-green-50 border border-green-200 rounded-lg"
  *ngIf="audioBlob && !isRecording"
>
  <button
    (click)="togglePlayback()"
    class="flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200"
    [class]="
      isPlaying
        ? 'bg-orange-500 hover:bg-orange-600 text-white'
        : 'bg-green-500 hover:bg-green-600 text-white'
    "
    [title]="isPlaying ? 'Pause' : 'Play'"
  >
    <span class="text-lg">{{ isPlaying ? "⏸️" : "▶️" }}</span>
  </button>

  <!-- Audio Progress Bar -->
  <div class="flex-1 min-w-0">
    <div class="flex items-center justify-between text-xs text-gray-600 mb-1">
      <span>{{ formatTime(playbackTime) }}</span>
      <span>{{ formatTime(totalDuration) }}</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-1">
      <div
        class="bg-green-500 h-1 rounded-full transition-all duration-100"
        [style.width.%]="progressPercentage"
      ></div>
    </div>
    <div class="text-xs text-gray-500 mt-1">
      Audio message • {{ formatFileSize(audioBlob.size) }}
    </div>
  </div>

  <div class="flex gap-2">
    <button
      (click)="sendAudio()"
      class="flex items-center justify-center w-10 h-10 bg-blue-500 text-white rounded-full hover:bg-blue-600 transition-all duration-200"
      title="Send audio message"
    >
      <span class="text-lg">📤</span>
    </button>
    <button
      (click)="deleteRecording()"
      class="flex items-center justify-center w-8 h-8 bg-red-500 text-white rounded-full hover:bg-red-600 transition-all duration-200"
      title="Delete"
    >
      <span class="text-sm">🗑️</span>
    </button>
  </div>
</div>

<!-- Error Message -->
<div
  class="flex items-center gap-2 p-3 bg-red-50 border border-red-200 rounded-lg text-red-600"
  *ngIf="errorMessage"
>
  <span class="text-lg">⚠️</span>
  <span class="text-sm">{{ errorMessage }}</span>
  <button
    (click)="clearError()"
    class="ml-auto text-red-500 hover:text-red-700"
    title="Dismiss"
  >
    ❌
  </button>
</div>

<!-- Hidden Audio Player -->
<audio
  #audioPlayer
  (ended)="onPlaybackEnded()"
  (timeupdate)="onTimeUpdate($event)"
  (loadedmetadata)="onMetadataLoaded($event)"
  class="hidden"
></audio>
